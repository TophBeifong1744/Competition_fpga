<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SoundSight #20 USB 摄像头采集</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; color: #1c2730; }
    h1 { font-size: 1.5rem; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0; }
    button, select { font: inherit; padding: 6px 10px; }
    video { display: block; width: 100%; max-height: 70vh; background: #111; object-fit: contain; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f4f6f8; padding: 12px; min-height: 80px; }
    .files a { display: inline-block; margin-right: 16px; }
    .hint { color: #46535d; }
  </style>
</head>
<body>
  <h1>SoundSight #20 · 电脑端 USB 摄像头取图</h1>
  <p class="hint">仅访问摄像头，不访问麦克风。先确认所选设备是转台上的 BL-H6；预览和保存由你点击启动。网页不上传图像。</p>
  <div class="row">
    <button id="grant">授权并列出摄像头</button>
    <label>设备 <select id="devices" disabled><option>请先授权</option></select></label>
    <label>分辨率 <select id="resolution"><option value="1280x720">1280×720</option><option value="640x480">640×480</option><option value="320x240">320×240</option></select></label>
  </div>
  <div class="row">
    <button id="start" disabled>打开预览</button>
    <button id="capture" disabled>保存当前帧与记录</button>
    <button id="stop" disabled>停止预览</button>
    <button id="journal">保存运行日志</button>
  </div>
  <video id="preview" autoplay playsinline muted></video>
  <p id="state">等待授权。请在电脑上通过 USB 连接实际摄像头。</p>
  <div id="files" class="files"></div>
  <h2>本次运行日志</h2>
  <pre id="log"></pre>
  <script>
    "use strict";
    const el = (id) => document.getElementById(id);
    const events = [];
    let stream = null;
    let selectedCamera = null;
    let currentFiles = [];

    function record(kind, detail = {}) {
      const entry = { utc: new Date().toISOString(), kind, detail };
      events.push(entry);
      el("log").textContent = events.map((e) => JSON.stringify(e)).join("\n");
    }
    function setState(message) { el("state").textContent = message; }
    function fail(error) {
      const message = error && error.message ? error.message : String(error);
      record("error", { name: error && error.name || "Error", message });
      setState("失败：" + message);
    }
    function downloadLink(blob, name, label) {
      const url = URL.createObjectURL(blob);
      currentFiles.push(url);
      const link = document.createElement("a");
      link.href = url;
      link.download = name;
      link.textContent = label + "（" + name + "）";
      el("files").appendChild(link);
    }
    function clearLinks() {
      currentFiles.forEach((url) => URL.revokeObjectURL(url));
      currentFiles = [];
      el("files").replaceChildren();
    }
    async function sha256(bytes) {
      const hash = await crypto.subtle.digest("SHA-256", bytes);
      return Array.from(new Uint8Array(hash), (b) => b.toString(16).padStart(2, "0")).join("");
    }
    function stopPreview(reason = "manual-stop") {
      if (stream) {
        stream.getTracks().forEach((track) => track.stop());
        stream = null;
        el("preview").srcObject = null;
        record(reason);
      }
      el("capture").disabled = true;
      el("stop").disabled = true;
      el("start").disabled = el("devices").disabled;
    }
    async function grantAndList() {
      try {
        if (!window.isSecureContext || !navigator.mediaDevices) {
          throw new Error("需要 localhost 或 HTTPS 的安全上下文");
        }
        const probe = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        let list;
        try {
          record("permission-granted", { initialTrackLabel: probe.getVideoTracks()[0]?.label || "unknown" });
          list = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
        } finally {
          probe.getTracks().forEach((track) => track.stop());
        }
        const select = el("devices");
        select.replaceChildren();
        for (const device of list) {
          const option = document.createElement("option");
          option.value = device.deviceId;
          option.textContent = device.label || "未命名摄像头";
          select.appendChild(option);
        }
        select.disabled = list.length === 0;
        el("start").disabled = list.length === 0;
        record("devices-listed", { count: list.length, labels: list.map((d) => d.label || "unknown") });
        setState(list.length ? "请选择实际 USB 摄像头，再打开预览。" : "没有找到摄像头。请检查 USB 连接与系统权限。");
      } catch (error) { fail(error); }
    }
    async function startPreview() {
      try {
        stopPreview("restart");
        const select = el("devices");
        const deviceId = select.value;
        if (!deviceId) throw new Error("请先选择一个有设备 ID 的摄像头");
        const [width, height] = el("resolution").value.split("x").map(Number);
        selectedCamera = { label: select.selectedOptions[0].textContent, deviceId, width, height };
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            deviceId: { exact: deviceId },
            width: { exact: width },
            height: { exact: height },
            frameRate: { ideal: 30 }
          }
        });
        const track = stream.getVideoTracks()[0];
        track.addEventListener("ended", () => {
          if (stream && track.readyState === "ended") {
            record("unexpected-stream-end", { label: track.label });
            stopPreview("stream-closed");
            setState("摄像头流已中断；停止取图，请检查 USB 连接。");
          }
        });
        el("preview").srcObject = stream;
        await el("preview").play();
        const settings = track.getSettings();
        record("stream-start", {
          label: track.label,
          requested: { width, height, fpsIdeal: 30 },
          negotiated: { width: settings.width, height: settings.height, frameRate: settings.frameRate }
        });
        if (settings.width !== width || settings.height !== height) {
          stopPreview("resolution-mismatch");
          throw new Error("实际分辨率与请求不符，请选择设备支持的档位");
        }
        el("start").disabled = true;
        el("capture").disabled = false;
        el("stop").disabled = false;
        setState("预览中：" + track.label + " · " + width + "×" + height);
      } catch (error) {
        stopPreview("start-failed");
        fail(error);
      }
    }
    async function captureFrame() {
      try {
        if (!stream || stream.getVideoTracks()[0]?.readyState !== "live") throw new Error("摄像头未在运行");
        const video = el("preview");
        if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA || !video.videoWidth) throw new Error("尚未收到有效画面");
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0);
        const blob = await new Promise((resolve, reject) => canvas.toBlob((b) => b ? resolve(b) : reject(new Error("PNG 编码失败")), "image/png"));
        const imageHash = await sha256(await blob.arrayBuffer());
        const stamp = new Date().toISOString().replace(/[:.]/g, "-");
        const base = "camera-" + stamp;
        const imageName = base + ".png";
        const track = stream.getVideoTracks()[0];
        const settings = track.getSettings();
        record("frame-captured", { imageName, width: canvas.width, height: canvas.height, sha256: imageHash });
        const report = {
          schema: "soundsight.camera.capture.v1",
          captured_utc: new Date().toISOString(),
          image_file: imageName,
          image_sha256: imageHash,
          image_bytes: blob.size,
          image_width: canvas.width,
          image_height: canvas.height,
          selected_camera_label: selectedCamera.label,
          live_track_label: track.label,
          browser_device_id_sha256: await sha256(new TextEncoder().encode(selectedCamera.deviceId)),
          requested: { width: selectedCamera.width, height: selectedCamera.height, fpsIdeal: 30 },
          negotiated: { width: settings.width, height: settings.height, frameRate: settings.frameRate ?? null },
          source: "browser getUserMedia video frame copied to lossless PNG; not a raw USB payload",
          events: events.slice()
        };
        clearLinks();
        downloadLink(blob, imageName, "保存图像");
        downloadLink(new Blob([JSON.stringify(report, null, 2) + "\n"], { type: "application/json" }), base + ".json", "保存采集记录");
        setState("取图成功。请分别保存图像和同名 JSON，然后运行 verify_capture.py。单帧不能证明持续帧率。");
      } catch (error) { fail(error); }
    }
    function saveJournal() {
      const blob = new Blob([JSON.stringify({ schema: "soundsight.camera.session.v1", events }, null, 2) + "\n"], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "camera-session-" + new Date().toISOString().replace(/[:.]/g, "-") + ".json";
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }
    el("grant").addEventListener("click", grantAndList);
    el("start").addEventListener("click", startPreview);
    el("capture").addEventListener("click", captureFrame);
    el("stop").addEventListener("click", () => { stopPreview(); setState("已停止预览。"); });
    el("journal").addEventListener("click", saveJournal);
    window.addEventListener("pagehide", () => stopPreview("page-closed"));
    if (!window.isSecureContext || !navigator.mediaDevices) setState("此页面需要由 localhost 打开；请按 README 运行本地服务器。");
  </script>
</body>
</html>
